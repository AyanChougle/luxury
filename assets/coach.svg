<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coachBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="coachGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a7c38"/>
      <stop offset="50%" stop-color="#ead39a"/>
      <stop offset="100%" stop-color="#c7a35a"/>
    </linearGradient>
    <radialGradient id="coachWheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ead39a"/>
      <stop offset="40%" stop-color="#444"/>
      <stop offset="80%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="coachGlow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#coachBg)" rx="16"/>
  <ellipse cx="400" cy="320" rx="330" ry="22" fill="rgba(199,163,90,0.07)" filter="url(#coachGlow)"/>

  <!-- VIP Sprinter Cruiser Coach Silhouette -->
  <g transform="translate(35, 50)">
    <!-- High Roof Coach Body -->
    <path d="M 60,240 L 60,110 C 60,95 72,85 90,85 L 610,85 C 640,85 660,105 675,145 L 705,215 C 715,230 710,242 690,242 C 670,242 650,242 640,242 C 630,208 590,188 550,192 C 510,198 480,228 480,242 L 250,242 C 250,228 220,192 180,192 C 140,192 110,222 105,242 L 60,242 Z" fill="#111113" stroke="url(#coachGold)" stroke-width="2"/>

    <!-- Privacy Panoramic Glazing Bar -->
    <path d="M 110,105 L 590,105 C 610,105 625,120 635,150 L 655,195 L 110,195 Z" fill="#1b1b22" stroke="rgba(199,163,90,0.3)" stroke-width="1.5"/>
    <line x1="210" y1="105" x2="210" y2="195" stroke="rgba(199,163,90,0.4)" stroke-width="1.5"/>
    <line x1="310" y1="105" x2="310" y2="195" stroke="rgba(199,163,90,0.4)" stroke-width="1.5"/>
    <line x1="410" y1="105" x2="410" y2="195" stroke="rgba(199,163,90,0.4)" stroke-width="1.5"/>
    <line x1="510" y1="105" x2="510" y2="195" stroke="rgba(199,163,90,0.4)" stroke-width="1.5"/>

    <!-- Gold Waistline Pinstripe -->
    <line x1="60" y1="205" x2="680" y2="205" stroke="url(#coachGold)" stroke-width="2"/>

    <!-- High-Power LED Headlight -->
    <polygon points="685,210 705,225 675,228 668,215" fill="#ead39a" filter="url(#coachGlow)"/>

    <!-- Wheels -->
    <g transform="translate(550, 242)">
      <circle cx="0" cy="0" r="46" fill="#080808" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="0" r="32" fill="url(#coachWheel)" stroke="url(#coachGold)" stroke-width="2"/>
    </g>
    <g transform="translate(180, 242)">
      <circle cx="0" cy="0" r="46" fill="#080808" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="0" r="32" fill="url(#coachWheel)" stroke="url(#coachGold)" stroke-width="2"/>
    </g>
  </g>

  <text x="400" y="370" font-family="'Playfair Display', serif" font-size="16" letter-spacing="4" fill="#c7a35a" text-anchor="middle">MERCEDES LUXURY VIP COACH (16 VIP)</text>
</svg>
